<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.3" />
    </pattern>

    <!-- Dynamic Flow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      fill: #38bdf8;
    }
    .status-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #10b981;
    }

    /* Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.55; }
    }
    @keyframes pulseOrb2 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.25; }
      50% { transform: scale(1.2) translate(25px, -15px); opacity: 0.45; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.7; }
      100% { transform: translateY(400px); opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb2 10s ease-in-out infinite; transform-origin: 1000px 300px; }
    .stream-line { stroke-dasharray: 8 6; animation: dashMove 2.5s linear infinite; }
    .stream-line-slow { stroke-dasharray: 6 6; animation: dashMove 4s linear infinite; }
    .float-card { animation: nodeFloat 4s ease-in-out infinite; }
    .float-card-delay { animation: nodeFloat 4s ease-in-out infinite 2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Background Animated Glow Orbs -->
  <circle cx="200" cy="100" r="220" fill="url(#glowGrad1)" class="orb-1" filter="url(#glow)" />
  <circle cx="1020" cy="280" r="240" fill="url(#glowGrad2)" class="orb-2" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Ambient Dynamic Circuit / API Pipeline Lines in Background -->
  <g opacity="0.35">
    <path d="M 50 340 L 350 340 L 420 300 L 780 300 L 850 350 L 1150 350" fill="none" stroke="#38bdf8" stroke-width="2" class="stream-line" />
    <path d="M 100 60 L 450 60 L 520 100 L 900 100 L 980 50 L 1120 50" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-line-slow" />
    <path d="M 600 20 L 600 380" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Interactive Visual Cards (Foreground decorative flow behind text) -->
  <g class="float-card" transform="translate(860, 70)">
    <rect width="280" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="30" cy="37" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="42" text-anchor="middle" class="status-text">200</text>
    <text x="60" y="32" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">POST /batch/test-run</text>
    <text x="60" y="52" font-family="sans-serif" font-size="11" fill="#94a3b8">Latency: 14ms • 10,000 req/s</text>
  </g>

  <g class="float-card-delay" transform="translate(890, 180)">
    <rect width="260" height="74" rx="12" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1.5" filter="url(#glow)"/>
    <circle cx="30" cy="37" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="42" text-anchor="middle" class="tag-text" font-size="10">CLI</text>
    <text x="60" y="32" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">EXEC newman run</text>
    <text x="60" y="52" font-family="sans-serif" font-size="11" fill="#10b981">✓ All 128 Assertions Passed</text>
  </g>

  <g class="float-card" transform="translate(830, 290)">
    <rect width="290" height="64" rx="10" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1.5"/>
    <circle cx="26" cy="32" r="6" fill="#818cf8"/>
    <text x="46" y="37" font-family="sans-serif" font-size="12" fill="#cbd5e1">Batch Runner Engine: <tspan fill="#38bdf8" font-weight="bold">ONLINE</tspan></text>
  </g>

  <!-- Foreground Title and Content (Ensured in foreground, never obscured) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 95)">
      <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="22" class="tag-text">CURATED REPOSITORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="190" fill="url(#textGrad)" class="title-text">
      Awesome Batch API Test Runner
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" class="subtitle-text">
      Production-grade tools for batch execution, collection testing &amp; high-concurrency load analysis.
    </text>

    <!-- Feature / Keyword Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="65" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">⚡ Batch Runners</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="207" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">📊 Load Testing</text>

      <!-- Pill 3 -->
      <rect x="284" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="354" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">🔄 CI/CD Pipelines</text>

      <!-- Pill 4 -->
      <rect x="436" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" />
      <text x="501" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#e2e8f0">🎯 Open Source</text>
    </g>
  </g>
</svg>
